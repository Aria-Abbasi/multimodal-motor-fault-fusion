project:
  name: early-fault-fusion-paper
  experiment_name: multimodal-motor-fault-fusion

runtime:
  seed: 42
  device: auto
  num_workers: 4

datasets:
  main: nln_emp
  robustness: paderborn
  benchmark: cwru
  modalities:
    - vibration
    - current
  leakage_rule: recording_level_no_cross_split

paths:
  data_root: data
  raw:
    nln_emp: data/raw/nln_emp
    paderborn: data/raw/paderborn
    cwru: data/raw/cwru
  interim: data/interim
  processed: data/processed
  metadata: data/metadata
  splits: data/splits
  artifacts_root: artifacts
  checkpoints: artifacts/checkpoints
  logs: artifacts/logs
  results_root: results
  runs: results/runs
  tables: results/tables
  figures: results/figures

training:
  batch_size: 128
  learning_rate: 0.001
  minimum_learning_rate: 0.00001
  stage1_epochs: 10
  stage2_epochs: 5
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  modality_dropout: 0.2
  warmup_ratio: 0.1
  family_loss_weight: 0.5
  amp: true
  preload: true
  loss_grid:
    - ce_1.0
    - ce_1.5
    - ce_2.0
    - ce_3.0
    - ce_4.0
    - dynamic_focal
  modality_gate_grid:
    - false
    - true

evaluation:
  metrics:
    - macro_f1
    - balanced_accuracy
    - early_fault_recall
    - auroc
    - auprc
    - mcc
