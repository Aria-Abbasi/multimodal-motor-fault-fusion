[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "early-fault-fusion-paper"
version = "0.1.0"
description = "Reproducible scaffold for early fault detection research with vibration-current fusion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3.0",
    "kagglehub>=0.3.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "openpyxl>=3.1.0",
    "pandas>=2.2.0",
    "PyYAML>=6.0.1",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "seaborn>=0.13.0",
    "torch>=2.2.0",
    "tqdm>=4.66.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
